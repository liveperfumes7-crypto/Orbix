name: admin-visual
on:
  workflow_dispatch:
  pull_request:
    paths: ["admin/**"]
jobs:
  shots:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://wppultvjscruthsuddae.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Screenshot public pages at phone and desktop widths
        run: |
          npm start & sleep 8
          mkdir -p shots
          for w in 390 1280; do
            for p in "" subscribe?app=1 privacy terms delete-account admin/login; do
              npx playwright screenshot --viewport-size="$w,900" "http://localhost:3000/$p" "shots/${w}_$(echo "$p" | tr '/?=' '___').png"
            done
          done
      - uses: actions/upload-artifact@v4
        with: { name: admin-screenshots, path: admin/shots }
