name: orbix
description: Orbix — cloud storage and creator channels.
publish_to: none
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  webview_flutter: ^4.9.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  video_player: ^2.9.1
  video_thumbnail: ^0.5.6
  screen_brightness: ^1.0.1
  wakelock_plus: ^1.2.8
  package_info_plus: ^8.0.2
  share_plus: ^10.0.2
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
